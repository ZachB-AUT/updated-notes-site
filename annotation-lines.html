<script>
  // Code annotation layout.
  //
  // Quarto renders annotation numbers as right-floated anchors *inside* the
  // code, with a gutter strip overlaid on top of it. That means the numbers
  // scroll with the code, and long lines slide underneath them. This moves the
  // anchors into a real column beside the <pre>, outside its scroll container.
  //
  // It also tags every line of a multi-line annotation: Quarto marks only the
  // first line with .code-annotation-target, but the full range is on the
  // annotation list entry as data-code-lines (e.g. "12,13").
  //
  // The marker class is .annotated-line rather than Quarto's own
  // .code-annotation-target, and the Quarto class is stripped. The copy button
  // deletes every child of <code> whose class starts with "code-annotation-" —
  // meant for the number anchors, but it matches the marked lines too, so
  // annotated lines go missing from copied code. Keeping the class off the
  // line spans leaves the copy handler with nothing to delete.
  (function () {
    const RAIL_ANCHOR_SIZE = 18;

    // (cell, annotation number) -> [line element ids]
    const lineIdsByAnnotation = new Map();

    const collectAnnotations = () => {
      const notes = window.document.querySelectorAll(
        "span[data-code-cell][data-code-lines][data-code-annotation]"
      );
      for (const note of notes) {
        const cell = note.getAttribute("data-code-cell");
        const number = note.getAttribute("data-code-annotation");
        const ids = note
          .getAttribute("data-code-lines")
          .split(",")
          .map((line) => cell + "-" + line.trim());
        lineIdsByAnnotation.set(cell + "/" + number, ids);
      }
    };

    const markAnnotatedLines = () => {
      for (const ids of lineIdsByAnnotation.values()) {
        for (const id of ids) {
          const lineEl = window.document.getElementById(id);
          if (lineEl) {
            lineEl.classList.remove("code-annotation-target");
            lineEl.classList.add("annotated-line");
          }
        }
      }
    };

    const buildRails = () => {
      for (const pre of window.document.querySelectorAll("pre.code-annotation-code")) {
        const container = pre.parentElement;
        if (!container || container.querySelector(":scope > .annotation-rail")) {
          continue;
        }
        const rail = window.document.createElement("div");
        rail.className = "annotation-rail";
        container.appendChild(rail);
        container.classList.add("has-annotation-rail");
        // Move, don't clone — the anchors carry Quarto's own click handling.
        for (const anchor of pre.querySelectorAll("a.code-annotation-anchor")) {
          rail.appendChild(anchor);
        }
      }
    };

    // Anchors are absolutely positioned in the rail, so they have to be lined
    // up with their code line by measurement. Redone on resize and font load.
    const positionAnchors = () => {
      for (const rail of window.document.querySelectorAll(".annotation-rail")) {
        const railTop = rail.getBoundingClientRect().top;
        for (const anchor of rail.querySelectorAll("a.code-annotation-anchor")) {
          const key =
            anchor.getAttribute("data-target-cell") +
            "/" +
            anchor.getAttribute("data-target-annotation");
          const ids = lineIdsByAnnotation.get(key);
          if (!ids || ids.length === 0) {
            continue;
          }
          const lineEl = window.document.getElementById(ids[0]);
          if (!lineEl) {
            continue;
          }
          const rect = lineEl.getBoundingClientRect();
          const offset = (rect.height - RAIL_ANCHOR_SIZE) / 2;
          anchor.style.top = rect.top - railTop + offset + "px";
        }
      }
    };

    const relayout = () => {
      positionAnchors();
    };

    const init = () => {
      collectAnnotations();
      if (lineIdsByAnnotation.size === 0) {
        return;
      }
      markAnnotatedLines();
      buildRails();
      positionAnchors();

      let frame;
      window.addEventListener("resize", () => {
        window.cancelAnimationFrame(frame);
        frame = window.requestAnimationFrame(relayout);
      });
      if (window.document.fonts && window.document.fonts.ready) {
        window.document.fonts.ready.then(relayout);
      }
    };

    if (window.document.readyState === "loading") {
      window.document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>
